<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLINE BOOK STORE</title>

    <style>
        .Header {
            background-color: orange;
            font-size: 30px;
            height: 80px;
            font-weight: bold;
            text-align: center;
            display: flex;
        }

        .logo {
            color: turquoise;
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 80px;
            width: 60px;
        }

        .title {
            color: aqua;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu {
            background-color: rgb(214, 177, 107);
            font-size: 30px;
            height: 80px;
            font-weight: bold;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .menu a {
            text-decoration: none;
            color: rgb(255, 0, 170);
        }

        .main {
            background-color: rgb(44, 187, 235);
            font-size: 20px;
            height: 300px;
            font-weight: bold;
            text-align: center;
            display: flex;
        }

        .left {
            color: red;
            width: 200px;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
        }

        .left a {
            text-decoration: none;
            color: red;
        }

        .right {
            color: aqua;
            flex: 1;
            border: 1px solid black;
            padding: 20px;
        }

        .right iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div class="Header">
        <div class="logo">
            <img src="g l bajaj logo.webp" alt="College Logo">
        </div>

        <div class="title">
            ONLINE BOOK STORE
        </div>
    </div>

    <div class="menu">
        <a href="home.html" target="content">Home</a>
        <a href="login.html" target="content">Login</a>
        <a href="registration.html" target="content">Registration</a>
        <a href="catalogue.html" target="content">Catalogue</a>
        <a href="cart.html" target="content">Cart</a>
    </div>

    <div class="main">

        <div class="left">
            <a href="cse.html" target="content">CSE</a>
            <a href="ece.html" target="content">ECE</a>
            <a href="eee.html" target="content">EEE</a>
            <a href="civil.html" target="content">CIVIL</a>
        </div>

        <div class="right">
            <iframe src="home.html" name="content"></iframe>
        </div>

    </div>

</body>
</html>
</body>
